name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libappindicator3-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            rpm \
            librsvg2-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
      - name: Install JavaScript dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run check:ts
      - name: Rust format check
        run: npm run fmt:check
      - name: Rust lint
        run: npm run lint:rust
      - name: Run frontend tests
        run: npm test
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test
      - name: Build Linux bundles
        run: npm run bundle:linux
      - name: Smoke test Linux bundles
        run: npm run smoke:bundles
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: WebApp Manager ${{ github.ref_name }}
          releaseBody: Automated release build
          releaseDraft: true
          prerelease: false
